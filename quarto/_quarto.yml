project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - assets/**
    - images/*.png
    - images/*.webp
    - images/*.jpg
    - fonts/*.woff2
    - media/*.mp4
    - captions/*.vtt
    - downloads/**
    - robots.txt
    - .nojekyll

lang: en
description: "A practical course on accelerometer study design, data processing, quality control, and analysis."

website:
  title: "Accelerometer Learning Course"
  site-url: "https://eryx-lee.github.io/accelerometer-learning-course/"
  description: "A practical course on accelerometer study design, data processing, quality control, and analysis."
  image: images/course-social-card.jpg
  image-alt: "Accelerometer Learning Course: from raw signal to analysis-ready data"
  favicon: images/lapaista-logo.png
  open-graph:
    locale: en_US
    site-name: "Accelerometer Learning Course"
  twitter-card:
    card-style: summary_large_image
  back-to-top-navigation: true
  repo-url: "https://github.com/eryx-lee/accelerometer-learning-course"
  repo-actions: [issue]
  search: true
  navbar:
    logo: images/lapaista-logo.png
    logo-alt: "LA PAISTA laboratory logo"
    pinned: true
    left:
      - text: "Course"
        href: index.qmd
      - text: "Modules"
        menu:
          - text: "1. Accelerometer Introduction"
            href: accelerometer-introduction.qmd
          - text: "2. Programming and Downloading"
            href: accelerometer-programming-and-downloading.qmd
          - text: "3. Organizing and Converting"
            href: organizing-and-converting.qmd
          - text: "4. Setting Up R and GGIR"
            href: setting-up-r-and-ggir.qmd
          - text: "5. Checking Data Quality"
            href: checking-data-quality.qmd
          - text: "6. Cleaning and Standardizing"
            href: cleaning-and-standardizing.qmd
          - text: "7. Final Dataset in Stata"
            href: setting-up-final-dataset-in-stata.qmd
          - text: "8. Knowledge Checking"
            href: knowledge-checking.qmd
      - text: "Workflow"
        href: index.qmd#workflow
      - text: "Toolkit"
        href: toolkit.qmd
      - text: "Resources"
        menu:
          - text: "FAQ"
            href: index.qmd#faq
          - text: "Glossary"
            href: glossary.qmd
          - text: "References"
            href: references.qmd
          - text: "Course information"
            href: course-information.qmd
          - text: "Change log"
            href: changelog.qmd
          - text: "Completion"
            href: completion.qmd
    right:
      - text: "Start"
        href: accelerometer-introduction.qmd
  page-footer:
    left: "Accelerometer Learning Course"
    right:
      - text: "LA PAISTA Lab Website"
        icon: globe2
        href: https://publish.illinois.edu/lapassstalab/
      - text: "Instagram"
        icon: instagram
        href: https://www.instagram.com/lapasssta_uiuc/
      - text: "Report an issue"
        icon: github
        href: https://github.com/eryx-lee/accelerometer-learning-course/issues/new
      - text: "Course information"
        icon: info-circle
        href: course-information.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: false
    number-sections: false
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: false
    canonical-url: true
    include-in-header: includes/meta.html
    include-before-body: includes/before-body.html
    include-after-body: includes/after-body.html
    fig-cap-location: bottom

execute:
  freeze: auto
