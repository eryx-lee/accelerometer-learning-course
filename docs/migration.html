<!doctype html>
<html lang="en" data-alc-migration-receiver="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Securely copy browser-only Accelerometer Learning Course progress from the former GitHub Pages address to the new course address.">
  <link rel="canonical" href="https://uiuclapasssta.github.io/accelerometer-learning-course/migration.html">
  <title>Transfer saved course data</title>
  <link rel="stylesheet" href="assets/migration.css">
  <script src="assets/migration-schema.js" defer></script>
  <script src="assets/new-site-receiver.js" defer></script>
</head>
<body>
  <main>
    <p>Accelerometer Learning Course</p>
    <h1>Transferring saved course data</h1>
    <p>Your saved course records are being copied directly between two browser windows. They are not placed in the URL or submitted to a server.</p>
    <p data-migration-receiver-status role="status" tabindex="-1">Preparing the secure transfer…</p>
    <p><a data-migration-receiver-fallback href="https://uiuclapasssta.github.io/accelerometer-learning-course/">Open the new course without importing</a></p>
    <noscript><p>JavaScript is required to transfer browser-only course data. You can still use the direct course link above.</p></noscript>
  </main>
</body>
</html>
