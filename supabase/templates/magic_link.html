<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Course sign-in code</title>
  </head>
  <body>
    <h2>Your Accelerometer Learning Course sign-in code</h2>
    <p>Enter this one-time code in the course sign-in dialog:</p>

    <p>If you did not request this code, ignore this email. Do not share the code.</p>
  </body>
</html>
